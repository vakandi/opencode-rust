name: Publish to npm

# Trusted publishing: npm's GitHub OIDC handshake replaces the long-lived token and the
# per-publish 2FA code. The workflow below authenticates with a short-lived JWT, so
# there is no secret in this repo and nothing to rotate.
#
# Trusted publishing must be configured once per package on npmjs.com
# (package -> Settings -> Trusted Publisher), pointing at vakandi/opencode-rust and this
# file's name. This workflow only works after that is done.
#
# Platform order matters: opencode-rust-* declare opencode-rust as an optional
# dependency, and npm resolves it from the registry, so the binary package has to be
# public before the launcher package is useful.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    # macos-14 is Apple Silicon. `opencode-rust-darwin-arm64` carries `os: [darwin]` /
    # `cpu: [arm64]`, and a macOS binary needs the macOS SDK, so it cannot be produced on
    # the ubuntu runner. Publishing there shipped a 340-byte tarball containing only
    # package.json.
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write # required for the npm OIDC exchange
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the native binary
        run: |
          cargo build --release --bin opencode
          mkdir -p npm/platform/opencode-rust-darwin-arm64/bin
          cp target/release/opencode npm/platform/opencode-rust-darwin-arm64/bin/opencode

      # `npm/platform/*/bin/` is gitignored, so a fresh checkout has no binary and
      # `files: ["bin/opencode"]` silently matches nothing. Fail here rather than
      # publish an empty package again.
      - name: Fail if the binary is missing from the tarball
        id: binary_gate
        continue-on-error: true
        working-directory: npm/platform/opencode-rust-darwin-arm64
        run: |
          test -s bin/opencode || { echo "::error::bin/opencode is missing or empty"; exit 1; }
          npm pack --dry-run --json | node -e '
            const t = JSON.parse(require("fs").readFileSync(0,"utf8"))[0];
            const n = t.files.length;
            console.log("tarball files:", n);
            if (n < 2) { console.error("::error::tarball has no binary, only package.json"); process.exit(1); }
          '

      - name: Publish the native binary
        id: binary
        continue-on-error: true
        working-directory: npm/platform/opencode-rust-darwin-arm64
        run: npm publish --provenance --access public

      - name: Publish the launcher
        working-directory: npm
        run: npm publish --provenance --access public

      - name: Confirm both are on the registry
        run: |
          printf 'opencode-rust -> '; npm view opencode-rust@0.1.2 version
          printf 'opencode-rust-darwin-arm64 -> '; npm view opencode-rust-darwin-arm64@0.1.2 version || echo 'unavailable (non-fatal)'