name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # attach release assets
  id-token: write   # required for the npm OIDC exchange

env:
  TAG: ${{ github.ref_name }}
  VERSION: ${{ github.ref_name }}

jobs:
  # One npm package, every platform. The binary ships as a release asset and install.js
  # fetches the one matching the host. Platform-scoped npm packages were tried and
  # abandoned: each is a 404 until someone creates it, and a missing one fails silently
  # as optionalDependencies rather than loudly.
  assets:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: opencode-darwin-arm64,        os: macos-14,    target: aarch64-apple-darwin,     binary: opencode }
          - { asset: opencode-darwin-x64,          os: macos-13,    target: x86_64-apple-darwin,      binary: opencode }
          - { asset: opencode-linux-x64-gnu,       os: ubuntu-22.04, target: x86_64-unknown-linux-gnu,  binary: opencode }
          - { asset: opencode-linux-x64-musl,      os: ubuntu-22.04, target: x86_64-unknown-linux-musl, binary: opencode }
          - { asset: opencode-linux-arm64-gnu,     os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, binary: opencode, cross: true }
          - { asset: opencode-win32-x64-msvc.exe,  os: windows-2022, target: x86_64-pc-windows-msvc,    binary: opencode.exe }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: "Build (native target)"
        if: ${{ !matrix.cross }}
        run: cargo build --release --bin opencode --target ${{ matrix.target }}

      - name: "Build (cross; the runner has no aarch64 linker)"
        if: ${{ matrix.cross }}
        run: cargo install cross --locked && cross build --release --bin opencode --target ${{ matrix.target }}

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          test -s "dist/${{ matrix.asset }}" || { echo "::error::binary missing for ${{ matrix.target }}"; exit 1; }
          # Not `sha256sum`: it is GNU coreutils, absent on the macOS runners, and since
          # `attach` needs every asset those two jobs killed every release since v0.1.2.
          # `openssl dgst` is not a substitute — it prints the filename before the hash,
          # and install.js takes the first field. `shasum` matches sha256sum's layout.
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  attach:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
          echo "attached:"; ls -la dist

  publish:
    needs: attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish the launcher
        working-directory: npm
        run: npm publish --provenance --access public

      - name: Confirm it is on the registry
        run: npm view "opencode-rust@$VERSION" version
