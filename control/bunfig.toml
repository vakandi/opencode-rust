telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "kitty-vt-wasm", "@stencil-hq/vibemon"]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
# bun test does NOT honor .gitignore; prune robomp's repo clones and
# scratch dirs so a root-level `bun test` doesn't walk into them.
#
# `bazel-*` are Bazel's convenience symlinks, and `bazel-oh-my-pi` points at
# the workspace root itself: without this the scanner recurses through that
# loop, exhausts file descriptors, and every test that pipes a child process's
# stdio fails with empty output or EPIPE.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "python/**",
  "docs/**",
  "runs/**",
  "python/robomp/data/**",
  ".wt/**",
  ".worktrees/**",
  "bazel-*/**",
  "**/bazel-out/**",
  # Upstream oh-my-pi release/tooling tests. They exercise the Bun SDK in
  # packages/, musl binary builds and the GitHub release pipeline — none of which
  # exist in this repo (Wave 1 excluded packages/; this harness is native Rust with
  # no container and no image). They fail on missing modules, not on our code.
  # Excluded rather than deleted so the upstream files stay intact for reference.
  "scripts/**",
]

[run]
bun = true
