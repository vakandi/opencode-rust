<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Share+Tech+Mono&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Share Tech Mono', monospace;
      color: #00e5ff;
      user-select: none;
    }
    .popup-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .bg-image {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 35px 40px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      color: #00e5ff;
      text-shadow: 0 0 15px rgba(0,229,255,0.8), 0 0 30px rgba(0,229,255,0.4);
      letter-spacing: 4px;
      font-family: 'Orbitron', monospace;
    }
    .title span {
      font-size: 14px;
      font-weight: 400;
      color: rgba(0,229,255,0.6);
      letter-spacing: 1px;
      margin-left: 12px;
    }
    .btn-close-popup {
      background: rgba(255,23,68,0.15);
      border: 1px solid rgba(255,23,68,0.5);
      color: #ff1744;
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 2px;
    }
    .btn-close-popup:hover {
      background: rgba(255,23,68,0.3);
      box-shadow: 0 0 12px rgba(255,23,68,0.5);
    }
    .subworker-grid {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 8px;
    }
    .subworker-grid::-webkit-scrollbar {
      width: 4px;
    }
    .subworker-grid::-webkit-scrollbar-track {
      background: rgba(0,229,255,0.05);
      border-radius: 2px;
    }
    .subworker-grid::-webkit-scrollbar-thumb {
      background: rgba(0,229,255,0.3);
      border-radius: 2px;
    }
    .subworker-card-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .subworker-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(0,10,20,0.85);
      border: 1px solid rgba(0,229,255,0.15);
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .subworker-card:hover {
      border-color: rgba(0,229,255,0.35);
      background: rgba(0,10,20,0.92);
    }
    .subworker-card.enabled {
      border-color: rgba(0,230,118,0.25);
    }
    .subworker-card.enabled:hover {
      border-color: rgba(0,230,118,0.45);
    }
    .subworker-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .main-badge {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffd54f;
      border: 1px solid rgba(255,213,79,0.5);
      background: rgba(255,213,79,0.12);
      border-radius: 3px;
      padding: 1px 5px;
      flex-shrink: 0;
      line-height: 1.3;
    }
    .main-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid rgba(255,213,79,0.4);
      background: rgba(255,213,79,0.08);
      color: rgba(255,213,79,0.85);
      cursor: pointer;
      font-size: 10px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .main-btn:hover {
      background: rgba(255,213,79,0.2);
      border-color: rgba(255,213,79,0.8);
      color: #ffd54f;
      box-shadow: 0 0 8px rgba(255,213,79,0.4);
    }
    .start-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(0,229,255,0.25);
      background: rgba(0,229,255,0.08);
      color: rgba(0,229,255,0.6);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      padding: 0;
    }
    .start-btn:hover {
      background: rgba(0,229,255,0.2);
      border-color: rgba(0,229,255,0.6);
      color: #00e5ff;
      box-shadow: 0 0 10px rgba(0,229,255,0.4);
      transform: scale(1.1);
    }
    .start-btn:active {
      transform: scale(0.95);
    }
    .model-select-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .model-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid rgba(156,39,176,0.4);
      background: rgba(156,39,176,0.1);
      color: rgba(156,39,176,0.8);
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
      white-space: nowrap;
      user-select: none;
    }
    .model-badge:hover {
      background: rgba(156,39,176,0.25);
      border-color: rgba(156,39,176,0.7);
      color: #ce93d8;
      box-shadow: 0 0 8px rgba(156,39,176,0.3);
    }
    .model-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 1000;
      background: rgba(10,12,18,0.97);
      border: 1px solid rgba(156,39,176,0.4);
      border-radius: 4px;
      padding: 4px 0;
      min-width: 200px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 10px rgba(156,39,176,0.15);
      backdrop-filter: blur(10px);
    }
    .model-dropdown.open { display: block; }
    .model-option {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      padding: 5px 10px;
      color: rgba(0,229,255,0.6);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
    }
    .model-option:hover {
      background: rgba(156,39,176,0.15);
      color: #ce93d8;
    }
    .model-option.selected {
      color: #ce93d8;
      background: rgba(156,39,176,0.1);
    }
    .model-option .model-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(156,39,176,0.4);
      flex-shrink: 0;
    }
    .model-option.selected .model-dot {
      background: #ce93d8;
      box-shadow: 0 0 4px rgba(206,147,216,0.6);
    }
    .model-provider {
      opacity: 0.7;
      margin-left: 6px;
      font-size: 8px;
      color: #ce93d8;
      letter-spacing: 0.5px;
    }
    .subworker-info {
      flex: 1;
      min-width: 0;
    }
    .subworker-name {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #00e5ff;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .subworker-card.enabled .subworker-name {
      color: #00e676;
      text-shadow: 0 0 8px rgba(0,230,118,0.4);
    }
    .subworker-desc {
      font-size: 11px;
      color: rgba(0,229,255,0.6);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subworker-path {
      font-size: 8px;
      color: rgba(0,229,255,0.3);
      letter-spacing: 0.3px;
      font-family: 'Share Tech Mono', monospace;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-badge {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 3px;
      letter-spacing: 1px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-badge.running {
      background: rgba(0,230,118,0.15);
      border: 1px solid rgba(0,230,118,0.5);
      color: #00e676;
      box-shadow: 0 0 6px rgba(0,230,118,0.3);
    }
    .status-badge.stopped {
      background: rgba(255,23,68,0.1);
      border: 1px solid rgba(255,23,68,0.3);
      color: rgba(255,23,68,0.7);
    }
    .status-badge.unknown {
      background: rgba(255,234,0,0.08);
      border: 1px solid rgba(255,234,0,0.3);
      color: rgba(255,234,0,0.6);
    }
    .toggle-switch-small {
      width: 32px;
      height: 16px;
      border-radius: 8px;
      background: rgba(255,23,68,0.25);
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      border: 1px solid rgba(255,23,68,0.3);
    }
    .toggle-switch-small.enabled {
      background: rgba(0,230,118,0.25);
      border-color: rgba(0,230,118,0.4);
    }
    .toggle-switch-small::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff1744;
      top: 2px;
      left: 2px;
      transition: all 0.2s ease;
      box-shadow: 0 0 4px rgba(255,23,68,0.5);
    }
    .toggle-switch-small.enabled::after {
      left: 18px;
      background: #00e676;
      box-shadow: 0 0 6px rgba(0,230,118,0.6);
    }
    .schedule-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: rgba(0,229,255,0.55);
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid rgba(0,229,255,0.15);
      background: rgba(0,229,255,0.05);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .schedule-badge.enabled {
      color: rgba(0,230,118,0.7);
      border-color: rgba(0,230,118,0.2);
      background: rgba(0,230,118,0.06);
    }
    .nextrun-badge {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 600;
      color: #00e5ff;
      padding: 4px 8px;
      border-radius: 3px;
      border: 1px solid rgba(0,229,255,0.2);
      background: rgba(0,229,255,0.07);
      flex-shrink: 0;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
    .nextrun-badge.enabled {
      color: #00e676;
      border-color: rgba(0,230,118,0.3);
      background: rgba(0,230,118,0.08);
      text-shadow: 0 0 6px rgba(0,230,118,0.3);
    }
    .nextrun-badge .nextrun-label {
      font-size: 7px;
      font-weight: 400;
      color: rgba(0,229,255,0.4);
      letter-spacing: 1px;
      display: block;
      text-align: center;
    }
    .nextrun-badge.enabled .nextrun-label {
      color: rgba(0,230,118,0.5);
    }
    .logs-btn-small {
      font-family: 'Orbitron', monospace;
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 3px 6px;
      border-radius: 3px;
      border: 1px solid rgba(0,229,255,0.3);
      background: rgba(0,229,255,0.08);
      color: rgba(0,229,255,0.7);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .logs-btn-small:hover {
      background: rgba(0,229,255,0.2);
      border-color: rgba(0,229,255,0.6);
      color: #00e5ff;
      box-shadow: 0 0 8px rgba(0,229,255,0.3);
    }
    .schedule-btn-small {
      font-family: 'Orbitron', monospace;
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 3px 6px;
      border-radius: 3px;
      border: 1px solid rgba(255,152,0,0.3);
      background: rgba(255,152,0,0.08);
      color: rgba(255,152,0,0.7);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .schedule-btn-small:hover {
      background: rgba(255,152,0,0.2);
      border-color: rgba(255,152,0,0.6);
      color: #ff9800;
      box-shadow: 0 0 8px rgba(255,152,0,0.3);
    }
    .chevron-btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid rgba(0,229,255,0.25);
      background: rgba(0,229,255,0.06);
      color: rgba(0,229,255,0.5);
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .chevron-btn:hover {
      background: rgba(0,229,255,0.15);
      border-color: rgba(0,229,255,0.5);
      color: #00e5ff;
    }
    .chevron-btn.open {
      background: rgba(0,229,255,0.15);
      border-color: rgba(0,229,255,0.5);
      color: #00e5ff;
    }
    /* Runs dropdown */
    .runs-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(0,6,16,0.96);
      border: 1px solid rgba(0,229,255,0.2);
      border-top: none;
      border-radius: 0 0 6px 6px;
      margin-top: -1px;
      max-height: 240px;
      overflow-y: auto;
    }
    .runs-dropdown.open {
      display: block;
    }
    .runs-dropdown::-webkit-scrollbar {
      width: 4px;
    }
    .runs-dropdown::-webkit-scrollbar-track {
      background: rgba(0,229,255,0.04);
    }
    .runs-dropdown::-webkit-scrollbar-thumb {
      background: rgba(0,229,255,0.2);
      border-radius: 2px;
    }
    .runs-header {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      color: rgba(0,229,255,0.4);
      letter-spacing: 1px;
      padding: 6px 14px;
      border-bottom: 1px solid rgba(0,229,255,0.08);
    }
    .runs-columns {
      font-family: 'Orbitron', monospace;
      font-size: 7px;
      color: rgba(0,229,255,0.3);
      letter-spacing: 1.5px;
      padding: 4px 14px 3px;
      border-bottom: 1px solid rgba(0,229,255,0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(0,229,255,0.03);
    }
    .runs-columns .col-file { flex: 1; min-width: 0; }
    .runs-columns .col-badges {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .runs-columns .col-badges span {
      min-width: 36px;
      text-align: right;
    }
    .run-item {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: rgba(0,229,255,0.55);
      padding: 5px 14px;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .run-item:hover {
      background: rgba(0,229,255,0.1);
      color: #00e5ff;
    }
    .run-item .run-filename {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .run-item .run-meta {
      font-size: 9px;
      color: rgba(0,229,255,0.3);
      flex-shrink: 0;
    }
    .run-item .run-badges {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
      margin-left: auto;
    }
    .run-badge {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .run-badge-time {
      background: rgba(0,230,118,0.12);
      border: 1px solid rgba(0,230,118,0.3);
      color: #00e676;
    }
    .run-badge-duration {
      background: rgba(0,230,118,0.08);
      border: 1px solid rgba(0,230,118,0.2);
      color: rgba(0,230,118,0.8);
    }
    .run-badge-running {
      background: rgba(255,255,0,0.08);
      border: 1px solid rgba(255,255,0,0.2);
      color: rgba(255,255,0,0.7);
    }
    .run-badge-crashed {
      background: rgba(255,152,0,0.12);
      border: 1px solid rgba(255,152,0,0.3);
      color: #ff9800;
    }
    .run-badge-unknown {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.35);
    }
    .runs-loading {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: rgba(0,229,255,0.35);
      padding: 8px 14px;
    }
    .runs-empty {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: rgba(0,229,255,0.25);
      padding: 8px 14px;
      font-style: italic;
    }
    .runs-more {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      color: rgba(0,229,255,0.3);
      text-align: center;
      padding: 4px 14px;
      border-top: 1px solid rgba(0,229,255,0.06);
      letter-spacing: 1px;
    }
    .footer {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,229,255,0.08);
    }
    .footer-hint {
      font-size: 9px;
      color: rgba(0,229,255,0.3);
      letter-spacing: 1px;
      font-family: 'Orbitron', monospace;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      color: rgba(0,229,255,0.5);
      letter-spacing: 3px;
    }
    .loading .dot-pulse {
      display: inline-block;
      animation: pulse-dot 1.4s ease-in-out infinite;
    }
    .loading .dot-pulse:nth-child(2) { animation-delay: 0.2s; }
    .loading .dot-pulse:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }
    /* Terminal log panel */
    .log-panel {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      background: rgba(0,4,12,0.97);
      flex-direction: column;
    }
    .log-panel.open { display: flex; }
    .log-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(0,229,255,0.15);
      flex-shrink: 0;
    }
    .log-panel-title {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 600;
      color: #00e5ff;
      letter-spacing: 2px;
    }
    .log-panel-title span {
      color: rgba(0,229,255,0.5);
      font-size: 10px;
      margin-left: 8px;
    }
    .log-panel-close {
      background: rgba(255,23,68,0.15);
      border: 1px solid rgba(255,23,68,0.4);
      color: #ff1744;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .log-panel-close:hover {
      background: rgba(255,23,68,0.3);
      box-shadow: 0 0 10px rgba(255,23,68,0.4);
    }
    .log-panel-refresh {
      background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.3);
      color: rgba(0,229,255,0.7);
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .log-panel-refresh:hover {
      background: rgba(0,229,255,0.2);
      border-color: rgba(0,229,255,0.6);
      color: #00e5ff;
    }
    .log-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .log-panel-body::-webkit-scrollbar { width: 5px; }
    .log-panel-body::-webkit-scrollbar-track { background: rgba(0,229,255,0.03); }
    .log-panel-body::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 3px; }
    .log-entry {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0,229,255,0.05);
    }
    .log-entry-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .log-role {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 3px;
      color: #fff;
      text-transform: uppercase;
    }
    .log-role.user { background: rgba(0,230,118,0.4); }
    .log-role.assistant { background: rgba(33,150,243,0.5); }
    .log-role.system { background: rgba(255,152,0,0.4); }
    .log-agent {
      font-size: 10px;
      color: rgba(0,229,255,0.5);
    }
    .log-time {
      font-size: 9px;
      color: rgba(0,229,255,0.3);
    }
    .log-text { color: rgba(0,229,255,0.8); white-space: pre-wrap; word-break: break-word; }
    .log-reasoning { color: rgba(156,39,176,0.7); font-style: italic; white-space: pre-wrap; word-break: break-word; }
    .log-tool { color: rgba(33,150,243,0.7); white-space: pre-wrap; word-break: break-word; }
    .log-tool-name { color: #64b5f6; font-weight: 600; }
    .log-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgba(0,229,255,0.4);
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 2px;
    }
    .log-empty {
      text-align: center;
      color: rgba(0,229,255,0.3);
      font-style: italic;
      padding: 40px;
    }
    .log-error {
      text-align: center;
      color: rgba(255,23,68,0.6);
      padding: 40px;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <img class="bg-image" src="./imgs/EliaPopup.png" alt="">
    <div class="content">
      <div class="header">
        <div class="title">SUBWORKERS <span>agents manager</span></div>
        <button class="btn-close-popup" id="btn-close">CLOSE</button>
      </div>
      <div class="subworker-grid" id="subworker-grid">
        <div class="loading">
          <span class="dot-pulse">●</span>
          <span class="dot-pulse">●</span>
          <span class="dot-pulse">●</span>
        </div>
      </div>
      <div class="footer">
        <span class="footer-hint">[ click toggle to enable / disable — requires plist in subworkers/plists/ ]</span>
      </div>
    </div>
  </div>

  <!-- Terminal-style log panel (overlay) -->
  <div class="log-panel" id="log-panel">
    <div class="log-panel-header">
      <div class="log-panel-title" id="log-panel-title">LOGS <span>loading...</span></div>
      <div style="display:flex;gap:8px;">
        <button class="log-panel-refresh" id="log-panel-refresh">REFRESH</button>
        <button class="log-panel-close" id="log-panel-close">✕ CLOSE</button>
      </div>
    </div>
    <div class="log-panel-body" id="log-panel-body">
      <div class="log-loading">LOADING SESSION DATA...</div>
    </div>
  </div>
  <script>
    const grid = document.getElementById('subworker-grid');
    // Track open dropdown state: { cardId: 'agent_name' }
    let openDropdown = null;
    // Cache runs per agent: { agentName: { runs: [], loadedAt: timestamp } }
    const runsCache = {};
    // Track selected model per agent: { agentName: modelSlug }
    const modelSelections = {};
    // Selected reasoning variant per agent: { agentName: 'low'|'medium'|... }
    const modelVariants = {};
    // Full catalog from GET /models (favorites first, server-sorted)
    let allModels = [];
    // Two-step selection state: { agentName: modelId } while picking thinking level
    const pendingModel = {};

    async function loadModelSelections() {
      try {
        const saved = await window.popupAPI.getModelSelections();
        if (saved && typeof saved === 'object') {
          Object.assign(modelSelections, saved);
        }
      } catch (_) {}
      try {
        const resp = await fetch(`${SUBWORKER_SERVER_URL}/models`);
        if (resp.ok) {
          const data = await resp.json();
          allModels = data.models || [];
        }
      } catch (_) {}
    }

    function saveModelSelection(name, model) {
      modelSelections[name] = model;
      window.popupAPI.saveModelSelection(name, model);
    }

    function applyModelSelection(name, model, variant) {
      modelSelections[name] = model;
      modelVariants[name] = variant || '';
      window.popupAPI.saveModelSelection(name, model);
      const dd = document.querySelector(`.model-dropdown[data-name="${name}"]`);
      const badge = dd ? dd.previousElementSibling : null;
      if (badge) {
        badge.textContent = '⚡ ' + model.split('/').pop() + (variant ? ` (${variant})` : '');
      }
      fetch(`${SUBWORKER_SERVER_URL}/status/${encodeURIComponent(name)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, variant: variant || null })
      }).catch(err => console.error('Model persist failed:', err.message));
    }

    function renderModelOptions(name) {
      const dd = document.querySelector(`.model-dropdown[data-name="${name}"]`);
      if (!dd) return;
      const current = modelSelections[name] || 'opencode/big-pickle';
      const currentVariant = modelVariants[name] || '';
      const pending = pendingModel[name];

      if (pending) {
        const m = allModels.find(x => x.id === pending);
        const variants = m ? (m.variants || []) : [];
        let html = `<div class="model-option back-option" data-back="1">← ${escHtml(m ? m.name : pending)}</div>`;
        html += `<div class="model-option${!currentVariant ? ' selected' : ''}" data-variant=""><span class="model-dot"></span>no extra thinking</div>`;
        for (const v of variants) {
          html += `<div class="model-option${currentVariant === v ? ' selected' : ''}" data-variant="${escHtml(v)}"><span class="model-dot"></span>thinking: ${escHtml(v)}</div>`;
        }
        dd.innerHTML = html;
        return;
      }

      let html = '';
      for (const m of allModels) {
        const sel = current === m.id ? ' selected' : '';
        const varTag = sel && currentVariant ? ` <span class="model-provider">${escHtml(currentVariant)}</span>` : '';
        html += `<div class="model-option${sel}" data-model="${escHtml(m.id)}"><span class="model-dot"></span>${escHtml(m.name)} <span class="model-provider">${escHtml(m.provider)}</span>${varTag}</div>`;
      }
      dd.innerHTML = html || '<div class="model-option">no models (server offline)</div>';
    }

    function renderSubworkers(workers) {
      if (!workers || workers.length === 0) {
        grid.innerHTML = '<div class="loading" style="font-size:13px;color:rgba(255,23,68,0.6);">no subworkers found</div>';
        return;
      }
      // Filter out placeholder agents
      workers = workers.filter(w => {
        const n = (w.name || '').toLowerCase();
        return !n.includes('change_me') && !n.includes('change-me');
      });
      if (workers.length === 0) {
        grid.innerHTML = '<div class="loading" style="font-size:13px;color:rgba(255,23,68,0.6);">no subworkers found</div>';
        return;
      }
      grid.innerHTML = '';
      workers.forEach((w, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'subworker-card-wrap';
        wrap.dataset.agentName = w.name;
        wrap.dataset.index = idx;

        const card = document.createElement('div');
        card.className = 'subworker-card' + (w.enabled ? ' enabled' : '');
        card.dataset.name = w.name;
        card.dataset.schedule = w.schedule ? JSON.stringify(w.schedule) : '';

        const runningText = w.running ? '● RUNNING' : '○ STOPPED';
        const runningCls = w.running ? 'running' : 'stopped';

        const schedDesc = formatScheduleDesc(w.schedule);
        const nextRun = getNextRun(w.schedule);
        const enabledCls = w.enabled ? ' enabled' : '';

        if (w.model) modelSelections[w.name] = w.model;
        if (w.variant) modelVariants[w.name] = w.variant;
        const curModel = modelSelections[w.name] || 'opencode/big-pickle';
        const curVariant = modelVariants[w.name] || '';
        const badgeText = curModel.split('/').pop() + (curVariant ? ` (${curVariant})` : '');

        card.innerHTML = `
          <div class="subworker-info">
            <div class="subworker-name-row">
              <div class="subworker-name">${escHtml(w.label)}</div>
              ${w.isMain ? '<span class="main-badge" title="Main agent">MAIN</span>' : ''}
              <button class="main-btn" data-name="${w.name}" data-is-main="${w.isMain ? '1' : '0'}" title="${w.isMain ? 'Unset main agent (default: Elia)' : 'Set as main agent'}">${w.isMain ? '✕' : '★'}</button>
              <div class="model-select-wrap">
                <div class="model-badge" data-name="${w.name}" title="Select model">⚡ ${escHtml(badgeText)}</div>
                <div class="model-dropdown" data-name="${w.name}"></div>
              </div>
              <button class="start-btn" data-name="${w.name}" title="Start agent">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4.5 20.5l4-4"/>
                  <path d="M15.5 5.5l4 4"/>
                  <path d="M10 2l1.5 3.5L15 7l-3.5 1.5L10 12l-1.5-3.5L5 7l3.5-1.5L10 2z"/>
                </svg>
              </button>
            </div>
            <div class="subworker-desc">${escHtml(w.description)}</div>
            <div class="subworker-path">${escHtml(w.path)}</div>
          </div>
          <span class="schedule-badge${enabledCls}" title="Schedule">${escHtml(schedDesc)}</span>
          <span class="nextrun-badge${enabledCls}" title="Next scheduled run">
            <span class="nextrun-label">NEXT</span>${escHtml(nextRun)}
          </span>
          <button class="schedule-btn-small" data-name="${w.name}" title="Change schedule">⏰</button>
          <button class="logs-btn-small" data-name="${w.name}" title="Open latest log in terminal">LOGS</button>
          <button class="chevron-btn" data-name="${w.name}" title="Browse per-run logs">▼</button>
          <span class="status-badge ${runningCls}">${runningText}</span>
          <div class="toggle-switch-small ${w.enabled ? 'enabled' : ''}" data-name="${w.name}"></div>
        `;

        wrap.appendChild(card);

        // Dropdown container (hidden by default)
        const dropdown = document.createElement('div');
        dropdown.className = 'runs-dropdown';
        dropdown.dataset.name = w.name;
        dropdown.innerHTML = '<div class="runs-loading">loading runs...</div>';
        wrap.appendChild(dropdown);

        grid.appendChild(wrap);
      });

      // LOGS button: opens inline terminal-style log panel
      document.querySelectorAll('.logs-btn-small').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          openLogPanel(this.dataset.name);
        });
      });

      // MAIN button: set/unset main agent
      document.querySelectorAll('.main-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const name = this.dataset.name;
          const isMain = this.dataset.isMain === '1';
          const msg = isMain
            ? `Unset ${name} as main agent? (defaults to Elia)`
            : `Set ${name} as main agent? It gets full repo access.`;
          if (confirm(msg)) {
            window.popupAPI.setMainAgent(isMain ? '' : name);
            window.electronAPI.send('get-subworkers');
          }
        });
      });

      // Schedule button: opens schedule picker popup
      document.querySelectorAll('.schedule-btn-small').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const name = this.dataset.name;
          // Find current schedule from the card's data attribute
          const card = this.closest('.subworker-card');
          const schedStr = card ? card.dataset.schedule : '';
          let currentSchedule = null;
          try { currentSchedule = schedStr ? JSON.parse(schedStr) : null; } catch(_) {}
          window.popupAPI.openSchedulePicker(name, currentSchedule);
        });
      });

      // Chevron button: toggle dropdown
      document.querySelectorAll('.chevron-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const name = this.dataset.name;
          toggleDropdown(name, this);
        });
      });

      // Toggle switches
      document.querySelectorAll('.toggle-switch-small').forEach(toggle => {
        toggle.addEventListener('click', function(e) {
          e.stopPropagation();
          window.electronAPI.send('toggle-subworker', this.dataset.name);
        });
      });

      // Start (wand) buttons — run agent now + open logs
      document.querySelectorAll('.start-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const name = this.dataset.name;
          const model = modelSelections[name] || 'opencode/big-pickle';
          window.popupAPI.runSubworkerNow(name, model);
        });
      });

      // Model badge: lazy-render options then toggle dropdown
      document.querySelectorAll('.model-badge').forEach(badge => {
        badge.addEventListener('click', function(e) {
          e.stopPropagation();
          const name = this.dataset.name;
          const wrap = this.closest('.model-select-wrap');
          const dropdown = wrap.querySelector('.model-dropdown');
          // Close all other model dropdowns
          document.querySelectorAll('.model-dropdown.open').forEach(dd => {
            if (dd !== dropdown) dd.classList.remove('open');
          });
          if (!dropdown.classList.contains('open')) {
            delete pendingModel[name];
            renderModelOptions(name);
          }
          dropdown.classList.toggle('open');
        });
      });
    }

    // Delegated: model option clicks (options are re-rendered dynamically)
    document.addEventListener('click', function(e) {
      const opt = e.target.closest('.model-option');
      if (!opt) return;
      const dd = opt.closest('.model-dropdown');
      if (!dd || !dd.classList.contains('open')) return;
      e.stopPropagation();
      const name = dd.dataset.name;

      if (opt.dataset.back) {
        delete pendingModel[name];
        renderModelOptions(name);
        return;
      }
      if (opt.dataset.model) {
        const model = opt.dataset.model;
        const m = allModels.find(x => x.id === model);
        if (m && (m.variants || []).length > 0) {
          pendingModel[name] = model;
          renderModelOptions(name);
        } else {
          applyModelSelection(name, model, '');
          dd.classList.remove('open');
        }
        return;
      }
      if (opt.dataset.variant !== undefined) {
        const model = pendingModel[name];
        if (!model) return;
        applyModelSelection(name, model, opt.dataset.variant);
        delete pendingModel[name];
        dd.classList.remove('open');
      }
    });

    // Close model dropdown when clicking elsewhere
    document.addEventListener('click', (e) => {
      if (e.target.closest('.model-dropdown') || e.target.closest('.model-badge')) return;
      document.querySelectorAll('.model-dropdown.open').forEach(dd => dd.classList.remove('open'));
    });

    function toggleDropdown(name, chevronBtn) {
      const wrap = chevronBtn.closest('.subworker-card-wrap');
      if (!wrap) return;
      const dropdown = wrap.querySelector('.runs-dropdown');

      // Close any previously open dropdown
      if (openDropdown && openDropdown !== name) {
        const prevWrap = document.querySelector(`.subworker-card-wrap[data-agent-name="${openDropdown}"]`);
        if (prevWrap) {
          const prevDropdown = prevWrap.querySelector('.runs-dropdown');
          const prevChevron = prevWrap.querySelector('.chevron-btn');
          if (prevDropdown) prevDropdown.classList.remove('open');
          if (prevChevron) prevChevron.classList.remove('open');
        }
      }

      if (!dropdown.classList.contains('open')) {
        // Open
        dropdown.classList.add('open');
        chevronBtn.classList.add('open');
        openDropdown = name;
        // Load runs if not cached
        if (!runsCache[name]) {
          dropdown.innerHTML = '<div class="runs-loading">loading runs...</div>';
          window.popupAPI.getSubworkerRuns(name);
        } else {
          renderRunsDropdown(dropdown, runsCache[name]);
        }
      } else {
        // Close
        dropdown.classList.remove('open');
        chevronBtn.classList.remove('open');
        openDropdown = null;
      }
    }

    function renderRunsDropdown(dropdown, data) {
      const runs = data && data.runs ? data.runs : [];
      if (runs.length === 0) {
        dropdown.innerHTML = '<div class="runs-empty">no run logs yet</div>';
        return;
      }
      const displayCount = Math.min(runs.length, 10);
      const hasMore = runs.length > 10;
      let html = `<div class="runs-header">LAST ${runs.length} RUNS</div>`;
      html += `<div class="runs-columns"><span class="col-file">FILE</span><span class="col-badges"><span>SIZE</span><span>WHEN</span><span>DURATION</span></span></div>`;
      for (let i = 0; i < displayCount; i++) {
        const r = runs[i];
        const sizeStr = r.size > 1024 ? (r.size / 1024).toFixed(0) + 'KB' : r.size + 'B';
        const timeBadge = r.timeAgo ? `<span class="run-badge run-badge-time">${escHtml(r.timeAgo)}</span>` : '';
        let durBadge;
        switch (r.status) {
          case 'success':
            durBadge = `<span class="run-badge run-badge-duration">${escHtml(r.duration)}</span>`;
            break;
          case 'crashed':
            durBadge = `<span class="run-badge run-badge-crashed">${escHtml(r.duration)} (crashed)</span>`;
            break;
          case 'unknown':
            durBadge = `<span class="run-badge run-badge-unknown">${r.duration ? escHtml(r.duration) + ' ???' : '???'}</span>`;
            break;
          default:
            durBadge = '<span class="run-badge run-badge-running">● RUNNING</span>';
        }
        html += `<div class="run-item" data-path="${escHtml(r.path)}">
          <span class="run-filename">${escHtml(r.filename)}</span>
          <span class="run-badges"><span class="run-meta">${sizeStr}</span>${timeBadge}${durBadge}</span>
        </div>`;
      }
      if (hasMore) {
        html += `<div class="runs-more">↓ ${runs.length - 10} more (scrollable)</div>`;
      }
      dropdown.innerHTML = html;

      // Click on run item opens log in terminal
      dropdown.querySelectorAll('.run-item').forEach(item => {
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          const path = this.dataset.path;
          if (path) window.popupAPI.openSubworkerLogFile(path);
        });
      });
    }

    function updateWorkerStatus(name, enabled, running) {
      const wraps = grid.querySelectorAll('.subworker-card-wrap');
      for (const wrap of wraps) {
        const card = wrap.querySelector('.subworker-card');
        if (card && card.dataset.name === name) {
          if (enabled) card.classList.add('enabled');
          else card.classList.remove('enabled');

          const badge = card.querySelector('.status-badge');
          if (badge) {
            if (running) {
              badge.textContent = '● RUNNING';
              badge.className = 'status-badge running';
            } else {
              badge.textContent = '○ STOPPED';
              badge.className = 'status-badge stopped';
            }
          }

          const toggle = card.querySelector('.toggle-switch-small');
          if (toggle) {
            if (enabled) toggle.classList.add('enabled');
            else toggle.classList.remove('enabled');
          }
          break;
        }
      }
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatScheduleDesc(schedule) {
      if (!schedule) return '-';
      return schedule.description || '-';
    }

    function getNextRun(schedule) {
      if (!schedule || !schedule.intervals || schedule.intervals.length === 0) return '--:--';
      const now = new Date();
      const currentDay = now.getDay();
      const currentHour = now.getHours();
      const currentMin = now.getMinutes();

      for (const intv of schedule.intervals) {
        if (intv.weekday !== undefined) {
          if (intv.weekday === currentDay) {
            if (intv.hour > currentHour || (intv.hour === currentHour && intv.minute > currentMin)) {
              const DAY_ABBR = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
              return `${DAY_ABBR[intv.weekday]} ${String(intv.hour).padStart(2, '0')}:${String(intv.minute).padStart(2, '0')}`;
            }
          } else if (intv.weekday > currentDay || (intv.weekday < currentDay && intv.hour > currentHour)) {
            const DAY_ABBR = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            return `${DAY_ABBR[intv.weekday]} ${String(intv.hour).padStart(2, '0')}:${String(intv.minute).padStart(2, '0')}`;
          }
        } else {
          if (intv.hour > currentHour || (intv.hour === currentHour && intv.minute > currentMin)) {
            return `${String(intv.hour).padStart(2, '0')}:${String(intv.minute).padStart(2, '0')}`;
          }
        }
      }
      if (schedule.intervals.length > 0) {
        const first = schedule.intervals[0];
        if (first.weekday !== undefined) {
          const DAY_ABBR = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
          return `${DAY_ABBR[first.weekday]} ${String(first.hour).padStart(2, '0')}:${String(first.minute).padStart(2, '0')}`;
        }
        return `${String(first.hour).padStart(2, '0')}:${String(first.minute).padStart(2, '0')}`;
      }
      return '--:--';
    }

    // Listen for subworker data from main
    window.electronAPI.onSubworkers((data) => {
      renderSubworkers(data);
    });
    window.electronAPI.onSubworkerToggled((result) => {
      if (result && result.name) {
        updateWorkerStatus(result.name, result.enabled, result.running);
      }
    });

    // Listen for per-run log data
    window.subworkerRunsAPI.onSubworkerRuns((data) => {
      if (!data || !data.name) return;
      // Cache the runs
      runsCache[data.name] = data;
      // Find the dropdown for this agent
      const wrap = document.querySelector(`.subworker-card-wrap[data-agent-name="${data.name}"]`);
      if (wrap) {
        const dropdown = wrap.querySelector('.runs-dropdown');
        if (dropdown && dropdown.classList.contains('open')) {
          renderRunsDropdown(dropdown, data);
        }
      }
    });

    // Request subworker list on load
    document.addEventListener('DOMContentLoaded', async () => {
      await loadModelSelections();
      window.electronAPI.send('get-subworkers');
    });

    // Close button
    document.getElementById('btn-close').addEventListener('click', () => {
      window.popupAPI?.close();
    });

    // ── Terminal-style log panel ──
    const SUBWORKER_SERVER_URL = window.popupAPI?.controlUrl || 'http://127.0.0.1:5680';
    const logPanel = document.getElementById('log-panel');
    const logPanelTitle = document.getElementById('log-panel-title');
    const logPanelBody = document.getElementById('log-panel-body');
    const logPanelClose = document.getElementById('log-panel-close');
    const logPanelRefresh = document.getElementById('log-panel-refresh');
    let logPanelAgent = null;

    function openLogPanel(name) {
      logPanelAgent = name;
      logPanelTitle.innerHTML = `LOGS <span>${escHtml(name)}</span>`;
      logPanelBody.innerHTML = '<div class="log-loading">LOADING SESSION DATA...</div>';
      logPanel.classList.add('open');
      fetchSessionLogs(name);
    }

    function closeLogPanel() {
      logPanel.classList.remove('open');
      logPanelAgent = null;
    }

    logPanelClose.addEventListener('click', closeLogPanel);
    logPanelRefresh.addEventListener('click', () => {
      if (logPanelAgent) fetchSessionLogs(logPanelAgent);
    });

    async function fetchSessionLogs(name) {
      try {
        const resp = await fetch(`${SUBWORKER_SERVER_URL}/sessions/${encodeURIComponent(name)}?limit=30`);
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: `HTTP ${resp.status}` }));
          logPanelBody.innerHTML = `<div class="log-error">${escHtml(err.detail || 'Failed to load logs')}</div>`;
          return;
        }
        const data = await resp.json();
        renderSessionLogs(data);
      } catch (e) {
        logPanelBody.innerHTML = `<div class="log-error">Connection failed: ${escHtml(e.message)}</div>`;
      }
    }

    function renderSessionLogs(data) {
      const messages = data.messages || [];
      if (messages.length === 0) {
        logPanelBody.innerHTML = '<div class="log-empty">No session data available</div>';
        return;
      }
      let html = '';
      for (const msg of messages) {
        const info = msg.info || {};
        const parts = msg.parts || [];
        const role = info.role || 'unknown';
        const agent = info.agent || '';
        const roleCls = role === 'user' ? 'user' : role === 'assistant' ? 'assistant' : 'system';

        let timeStr = '';
        if (info.time_created) {
          const d = new Date(info.time_created);
          timeStr = d.toLocaleTimeString();
        }

        html += '<div class="log-entry">';
        html += '<div class="log-entry-meta">';
        html += `<span class="log-role ${roleCls}">${escHtml(role)}</span>`;
        if (agent) html += `<span class="log-agent">${escHtml(agent)}</span>`;
        if (timeStr) html += `<span class="log-time">${escHtml(timeStr)}</span>`;
        html += '</div>';

        for (const part of parts) {
          const type = part.type || '';
          if (type === 'text' && part.text) {
            html += `<div class="log-text">${escHtml(part.text)}</div>`;
          } else if (type === 'reasoning' && part.text) {
            html += `<div class="log-reasoning">[thinking] ${escHtml(part.text)}</div>`;
          } else if (type === 'tool') {
            const toolName = part.tool || '?';
            let toolText = `[tool: ${toolName}]`;
            if (part.input) toolText += ` ${escHtml(String(part.input).substring(0, 200))}`;
            if (part.output) toolText += ` → ${escHtml(String(part.output).substring(0, 200))}`;
            html += `<div class="log-tool"><span class="log-tool-name">${escHtml(toolName)}</span> ${toolText}</div>`;
          }
        }
        html += '</div>';
      }
      logPanelBody.innerHTML = html;
      // Auto-scroll to bottom
      logPanelBody.scrollTop = logPanelBody.scrollHeight;
    }
  </script>
</body>
</html>
